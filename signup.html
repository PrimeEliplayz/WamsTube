<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account - WamsTube</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="site-theme.css">
</head>
<body data-auth-mode="signup">
    <header class="top-bar">
        <a class="site-brand" href="index.html">
            <img class="site-brand-logo" src="download.jpeg" alt="WamsTube logo">
            <span>Wams Tube</span>
        </a>
        <a class="account-button auth-home-link" href="index.html">Home</a>
    </header>
    <main class="auth-page">
        <section class="auth-box auth-standalone">
            <h1 class="auth-heading" id="authHeading">Create your channel</h1>
            <p class="auth-help" id="authHelp">Only @mtps.us email addresses can create an account.</p>
            <label class="upload-label" for="authEmail">School email</label>
            <input class="upload-input" id="authEmail" type="email" autocomplete="email" placeholder="you@mtps.us">
            <label class="upload-label" for="authPassword">Password</label>
            <input class="upload-input" id="authPassword" type="password" autocomplete="new-password" placeholder="Password">
            <div id="signupChannelField">
                <label class="upload-label" for="signupChannel">Channel name</label>
                <input class="upload-input" id="signupChannel" maxlength="40" placeholder="Choose your channel name">
            </div>
            <label class="auth-terms-option" id="signupTermsField">
                <input id="signupTerms" type="checkbox" required>
                <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a>.</span>
            </label>
            <div id="signupCaptchaField" class="auth-captcha-field">
                <div id="signupTurnstile"></div>
                <p class="auth-setup-note" id="signupCaptchaHelp">Complete the Cloudflare check to create an account.</p>
            </div>
            <p class="auth-error" id="authError" role="alert"></p>
            <div class="auth-actions">
                <button id="authSubmit" type="button" onclick="submitAuth()">Create account</button>
                <a class="auth-secondary" href="login.html">Sign in instead</a>
            </div>
            <p class="auth-setup-note">Account creation requires this project to be connected to Supabase.</p>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=wamsTurnstileLoaded&render=explicit" defer></script>
    <script src="auth.js"></script>
    <script src="supabase-config.js"></script>
    <script src="site-theme.js"></script>
</body>
</html>
