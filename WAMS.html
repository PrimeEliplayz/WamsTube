<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WamsTube</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: white; color: #0f0f0f; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 220px; background: #fff; border-right: 1px solid #e5e5e5; padding: 16px 12px; }
    .sidebar-item { width: 100%; border: 0; background: transparent; padding: 12px 14px; border-radius: 10px; margin-bottom: 6px; text-align: left; cursor: pointer; font-size: 14px; }
    .sidebar-item.active { background: #f2f2f2; }
    .page { display: none; margin-left: 220px; padding: 24px; }
    .page.active { display: block; }
    .channel-panel { display: none; }
  </style>
</head>
<body>
  <aside class="sidebar">
    <button class="sidebar-item active" onclick="selectSidebar(this)">Home</button>
    <button class="sidebar-item" onclick="selectSidebar(this)">Subscriptions</button>
    <button class="sidebar-item" onclick="openChannel()">Your channel</button>
  </aside>

  <main id="homePage" class="page active">
    <h1>WamsTube</h1>
    <p>Home page placeholder</p>
  </main>

  <main id="channelPage" class="page">
    <h1>Channel</h1>
    <p>Your channel page placeholder</p>
    <button onclick="closeChannel()">Back</button>
  </main>

  <script>
    function selectSidebar(button) {
      const items = document.querySelectorAll('.sidebar-item');
      items.forEach(function(item) {
        item.classList.toggle('active', item === button);
      });
    }

    function openChannel() {
      const home = document.getElementById('homePage');
      const channel = document.getElementById('channelPage');
      if (home) home.classList.remove('active');
      if (channel) channel.classList.add('active');
    }

    function closeChannel() {
      const home = document.getElementById('homePage');
      const channel = document.getElementById('channelPage');
      if (channel) channel.classList.remove('active');
      if (home) home.classList.add('active');
    }

    function channelNameTaken(name) {
      return false;
    }
  </script>
</body>
</html>
