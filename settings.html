<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Settings - WamsTube</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="site-theme.css">
</head>
<body class="settings-body">
    <header class="settings-topbar">
        <a class="settings-brand" href="index.html" aria-label="WamsTube home">
            <img src="download.jpeg" alt="">
            <span>WamsTube</span>
        </a>
        <a class="settings-home-link" href="index.html"><span class="material-symbols-rounded" aria-hidden="true">arrow_back</span> Back to WamsTube</a>
    </header>

    <main class="settings-page">
        <div class="settings-heading">
            <div>
                <p class="settings-eyebrow">YOUR EXPERIENCE</p>
                <h1>Settings</h1>
                <p>Manage 100 preferences across playback, privacy, accessibility, and more. Settings are saved in this browser and are not synced to your account.</p>
            </div>
            <button class="settings-reset" id="settingsReset" type="button">Reset all</button>
        </div>
        <div class="settings-toolbar">
            <label class="settings-search-label" for="settingsSearch"><span class="material-symbols-rounded" aria-hidden="true">search</span></label>
            <input id="settingsSearch" type="search" placeholder="Search settings" autocomplete="off">
            <span id="settingsCount" class="settings-count" aria-live="polite">100 settings</span>
        </div>
        <p class="settings-status" id="settingsStatus" role="status" aria-live="polite">Changes save automatically on this device.</p>
        <div class="settings-categories" id="settingsCategories"></div>
    </main>
    <script src="settings.js"></script>
    <script src="supabase-config.js"></script>
    <script src="site-theme.js"></script>
</body>
</html>
