<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorts - WamsTube</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="browse.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet">
    <link rel="stylesheet" href="site-theme.css">
</head>
<body data-browse-page="shorts">
    <header class="top-bar">
        <a class="site-brand" href="index.html">
            <img class="site-brand-logo" src="download.jpeg" alt="WamsTube logo">
            <span>Wams Tube</span>
        </a>

        <button class="account-button" onclick="window.location.href='index.html'">
            Home
        </button>
    </header>

    <main class="shorts-page">
        <div class="shorts-heading">
            <div>
                <h1>Shorts</h1>
                <p>Scroll to watch short videos.</p>
            </div>

            <button id="shortsMuteButton" class="shorts-top-button" type="button" aria-label="Unmute videos" aria-pressed="true">
                <span id="shortsMuteIcon" class="material-symbols-rounded" aria-hidden="true">volume_off</span>
            </button>
        </div>

        <nav class="shorts-navigation" aria-label="Shorts navigation">
            <button id="shortsPreviousButton" class="shorts-navigation-button" type="button" aria-label="Previous Short" disabled>
                <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_up</span>
            </button>
            <button id="shortsNextButton" class="shorts-navigation-button" type="button" aria-label="Next Short" disabled>
                <span class="material-symbols-rounded" aria-hidden="true">keyboard_arrow_down</span>
            </button>
        </nav>

        <p id="browseStatus" class="browse-status"></p>

        <section
            id="browseVideoGrid"
            class="shorts-feed"
            aria-label="Short videos"
        ></section>

        <section id="browseEmpty" class="empty-channel" hidden>
            <div class="empty-channel-title">
                No Shorts available
            </div>

            <div class="empty-channel-text">
                Videos marked as Shorts will appear here.
            </div>
        </section>
    </main>

    <div class="shorts-comment-backdrop" id="shortsCommentBackdrop"></div>
    <aside class="shorts-comment-panel" id="shortsCommentPanel" aria-label="Comments" aria-hidden="true">
        <div class="shorts-comment-header">
            <h2><span id="shortsCommentCount">0</span> comments</h2>
            <button class="shorts-comment-close" id="shortsCommentClose" type="button" aria-label="Close comments">×</button>
        </div>
        <div class="shorts-comment-list" id="shortsCommentList" aria-live="polite"></div>
        <form class="shorts-comment-form" id="shortsCommentForm" hidden>
            <input id="shortsCommentInput" type="text" maxlength="1000" placeholder="Add a comment…" aria-label="Add a comment" required>
            <button id="shortsCommentSubmit" type="submit">Send</button>
        </form>
        <p class="shorts-comment-auth" id="shortsCommentAuth">Sign in to comment. <a href="login.html">Sign in</a></p>
    </aside>

    <script src="script.js"></script>
    <script src="browse.js"></script>
    <script src="supabase-config.js"></script>
    <script src="site-theme.js"></script>
</body>
</html>
