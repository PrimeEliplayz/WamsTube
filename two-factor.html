<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Verify sign-in - WamsTube</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="site-theme.css">
</head>
<body data-auth-mode="login">
    <header class="top-bar">
        <a class="site-brand" href="index.html">
            <img class="site-brand-logo" src="download.jpeg" alt="WamsTube logo">
            <span>Wams Tube</span>
        </a>
        <a class="account-button auth-home-link" href="index.html">Home</a>
    </header>
    <main class="auth-page">
        <section class="auth-box auth-standalone two-factor-card" aria-labelledby="twoFactorHeading">
            <div class="two-factor-icon" aria-hidden="true">🔐</div>
            <h1 class="auth-heading" id="twoFactorHeading">Verify it’s you</h1>
            <p class="auth-help">Enter the six-digit code from your authenticator app to finish signing in. If you can't, you're a hacker</p>
            <form id="twoFactorForm" novalidate>
                <label class="upload-label" for="twoFactorCode">Authenticator code</label>
                <input class="upload-input two-factor-code" id="twoFactorCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="000000" aria-describedby="twoFactorStatus" required>
                <p class="auth-error two-factor-status" id="twoFactorStatus" role="status" aria-live="polite"></p>
                <div class="auth-actions two-factor-actions">
                    <button id="twoFactorSubmit" type="submit">Verify and sign in</button>
                    <button id="twoFactorCancel" class="two-factor-cancel" type="button">Cancel</button>
                </div>
            </form>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="auth.js"></script>
    <script src="two-factor.js"></script>
    <script src="site-theme.js"></script>
</body>
</html>
